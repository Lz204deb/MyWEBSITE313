<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>排行榜</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system‑ui}
body{background:#12121a;color:#eee;padding:24px;max‑width:1100px;margin:0 auto}
h1{text‑align:center;margin‑bottom:24px}
table{width:100%;border‑collapse:collapse}
th,td{border:1px solid #2a2a3c;padding:10px;text‑align:center}
th{background:#1e1e2f}
.rating‑red{color:#ff4444;font‑weight:bold}
.avatar{width:44px;height:44px;border‑radius:50%;object‑fit:cover}
.back{margin‑bottom:16px;color:#60a5fa;text‑decoration:none}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回导航</a>
<h1>🏆 段位排行榜</h1>
<table>
<thead>
<tr>
<th>排名</th>
<th>头像</th>
<th>游戏账号</th>
<th>简介</th>
<th>Kill</th>
<th>Death</th>
<th>Rating(K/D)</th>
<th>段位分(星)</th>
<th>段位</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>

<script>
const API = "https://rank-api.653476937.workers.dev/api/getAll";
function getTier(star){
if(star<=10) return "普通S";
if(star<=25) return "黄金SS";
if(star<=50) return "钻石S";
return "魔王S";
}
(async()=>{
const res = await fetch(API);
const players = await res.json();
players.sort((a,b)=>Number(b.star)-Number(a.star));
const tb = document.getElementById("tb");
players.forEach((p,i)=>{
const rating = p.death == 0 ? p.kill : (p.kill/p.death);
const cls = rating < 1 ? "rating‑red" : "";
tb.innerHTML += `
<tr>
<td>${i+1}</td>
<td><img class="avatar" src="${p.avatar||''}" alt="avatar"></td>
<td>${p.name||""}</td>
<td>${p.desc||""}</td>
<td>${p.kill||0}</td>
<td>${p.death||0}</td>
<td class="${cls}">${rating.toFixed(2)}</td>
<td>${p.star||0}</td>
<td>${getTier(Number(p.star))}</td>
</tr>
`
})
})();
</script>
</body>
</html>
